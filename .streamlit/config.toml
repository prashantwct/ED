[server]
# The sightings export is ~400 KB and centroids ~260 KB. A tight cap stops
# an accidental multi-GB upload exhausting the container.
maxUploadSize = 10
# XSRF protection requires CORS to stay enabled; setting enableCORS=false
# alongside it is overridden by Streamlit and warns on every start.
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Viewers never need Deploy, Rerun or Clear cache, and "auto" shows them to
# anyone on localhost -- a training laptop, an office machine. Developers
# get them back with `streamlit run app.py --client.toolbarMode developer`.
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#1f5f3f"
